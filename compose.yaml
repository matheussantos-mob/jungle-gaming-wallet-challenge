services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jungle
      POSTGRES_PASSWORD: jungle
      POSTGRES_DB: jungle
    ports:
      - "5439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jungle -d jungle"]
      interval: 2s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
  localstack:
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
  migrate:
    profiles: ["app"]
    build: .
    command: ["bun", "scripts/migrate.ts"]
    environment:
      DATABASE_URL: postgresql://jungle:jungle@postgres:5432/jungle
    depends_on:
      postgres:
        condition: service_healthy
  api:
    profiles: ["app"]
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://jungle:jungle@postgres:5432/jungle
      SQS_ENDPOINT: http://localstack:4566
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
  consumer:
    profiles: ["app"]
    build: .
    restart: unless-stopped
    command: ["bun", "src/workers/run-consumer.ts"]
    environment:
      DATABASE_URL: postgresql://jungle:jungle@postgres:5432/jungle
      SQS_ENDPOINT: http://localstack:4566
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:9464/metrics').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
  outbox:
    profiles: ["app"]
    build: .
    restart: unless-stopped
    command: ["bun", "src/workers/run-outbox.ts"]
    environment:
      DATABASE_URL: postgresql://jungle:jungle@postgres:5432/jungle
      SQS_ENDPOINT: http://localstack:4566
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:9465/metrics').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
  pending:
    profiles: ["app"]
    build: .
    restart: unless-stopped
    command: ["bun", "src/workers/run-pending.ts"]
    environment:
      DATABASE_URL: postgresql://jungle:jungle@postgres:5432/jungle
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:9466/metrics').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  pgdata:
